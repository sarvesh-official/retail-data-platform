# Retail Data Platform — local infrastructure
# Start: docker compose up -d
# Stop:  docker compose down
# Reset: docker compose down -v   (also deletes data volumes)

services:

  # --- MinIO: S3-compatible object storage where the CSV lives ---
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: retail-minio
    ports:
      - "9000:9000"  
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: retail-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/retail-data --ignore-existing;
      mc cp /seed/sales_orders_100.csv local/retail-data/sales_orders_100.csv;
      echo 'Bucket retail-data created and seeded with sales_orders_100.csv';
      "
    volumes:
      - ./dataset/processed:/seed:ro

  # --- PostgreSQL: destination database ---
  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: retaildb
      POSTGRES_USER: retailuser
      POSTGRES_PASSWORD: retailpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailuser -d retaildb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Flink JobManager: coordinator (schedules jobs, hosts the Web UI on 8081) ---
  jobmanager:
    image: flink:1.20.1-java17
    container_name: retail-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        execution.checkpointing.interval: 10s
    volumes:
      - ./target:/opt/flink/jars-to-submit:ro

  # --- Flink TaskManager: worker that runs the operators ---
  taskmanager:
    image: flink:1.20.1-java17
    container_name: retail-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        execution.checkpointing.interval: 10s

  # --- pgAdmin: web UI for PostgreSQL (just a viewer, not part of the pipeline) ---
  # Login: admin@retail.com / admin
  # Server password when prompted: retailpassword
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: retail-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@retail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  minio-data:
  postgres-data:
  pgadmin-data:
